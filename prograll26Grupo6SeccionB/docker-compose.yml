version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Prueba2
    ports:
      - "1483:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Mami2015
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

volumes:
  mssql_data:
    driver: local