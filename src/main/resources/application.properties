# 1. Tipo de Base de Datos
quarkus.datasource.db-kind=mssql

# 2. Desactivar servicios dev autom\u00e1ticos (para que use tu Docker real)
quarkus.datasource.devservices.enabled=false

# 3. URL apuntando al contenedor Docker (Puerto 1493 y Base BD_Reclutamiento)
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1493;databaseName=BD_Reclutamiento;encrypt=false;trustServerCertificate=true

# 4. Credenciales de Docker Compose
quarkus.datasource.username=sa
quarkus.datasource.password=Mami2015

# 5. IMPORTANTE: No tocar la estructura de la BD (ya la cre\u00f3 tu script SQL)
quarkus.hibernate-orm.database.generation=none

